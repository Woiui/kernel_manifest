name: Build OnePlus SukiSU Ultra (LZ4KD) - Stable

on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "CPU Platform"
        required: true
        type: choice
        options: ['sm8650']
        default: 'sm8650'
      FEIL:
        description: "Device Model"
        required: true
        type: choice
        options: ['gt5pro']
        default: 'gt5pro'
      CPUD:
        description: "SoC Codename"
        required: true
        type: choice
        options: ['pineapple']
        default: 'pineapple'
      ANDROID_VERSION:
        description: "Android Version"
        required: true
        type: choice
        options: ['android14']
        default: 'android14'
      KERNEL_VERSION:
        description: "Kernel Version"
        required: true
        type: choice
        options: ['6.1']
        default: '6.1'

jobs:
  build:
    name: Build ${{ github.event.inputs.FEIL }}
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      KERNEL_DIR: ${{ github.workspace }}/kernel_workspace/kernel_platform

    steps:
      - name: Prepare Workspace
        run: |
          mkdir -p ${{ env.WORKSPACE }}
          echo "Workspace created at: ${{ env.WORKSPACE }}"

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 14336
          temp-reserve-mb: 6144
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Setup Environment
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          sudo apt update && sudo apt full-upgrade -y
          sudo apt install -y \
            python3 python3-pip git curl \
            build-essential flex bison libssl-dev \
            rsync unzip bc libelf-dev

      - name: Initialize Repo
        run: |
          cd ${{ env.WORKSPACE }}
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          repo init -u https://github.com/ferstar/kernel_manifest.git \
            -b realme/${{ github.event.inputs.CPU }} \
            -m ${{ github.event.inputs.FEIL }}.xml \
            --depth=1 \
            --repo-url=https://gerrit.googlesource.com/git-repo
          repo sync -j$(nproc) --force-sync --no-clone-bundle

      - name: Clean Build Artifacts
        run: |
          cd ${{ env.KERNEL_DIR }}
          find . -name BUILD.bazel -exec sed -i '/protected_exports_list/d' {} +
          find . -name abi_gki_protected_exports_* -delete 2>/dev/null || true

      - name: Patch Version Scripts
        run: |
          cd ${{ env.KERNEL_DIR }}
          for scm_file in $(find . -name setlocalversion); do
            sed -i -e 's/-dirty//g' -e '/scm_version/d' $scm_file
            echo 'res="${res/-dirty/}"' >> $scm_file
          done
          git add . && git commit -m "[CI] Clean version tags" || true

      - name: Setup KernelSU
        run: |
          cd ${{ env.KERNEL_DIR }}
          curl -sL https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh | bash -s susfs-dev
          KSU_VER=$(( $(git rev-list --count HEAD) + 10600 ))
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=.*/DKSU_VERSION=$KSU_VER/" kernel/Makefile

      - name: Apply Patches
        run: |
          cd ${{ env.WORKSPACE }}
          git clone --filter=blob:none --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          
          rsync -av susfs4ksu/kernel_patches/ ${{ env.KERNEL_DIR }}/common/
          cp -rf SukiSU_patch/other/zram/lz4k/* ${{ env.KERNEL_DIR }}/common/

          cd ${{ env.KERNEL_DIR }}/common
          for patch_file in *.patch; do
            patch -p1 --ignore-whitespace < $patch_file || echo "Skipped: $patch_file"
          done

      - name: Configure Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          config_file="common/arch/arm64/configs/gki_defconfig"
          declare -A config_flags=(
            ["KSU"]="y"
            ["KPM"]="y"
            ["KSU_SUSFS"]="y"
            ["CRYPTO_LZ4HC"]="y"
            ["CRYPTO_LZ4KD"]="y"
          )
          for key in "${!config_flags[@]}"; do
            grep -q "CONFIG_$key" $config_file || echo "CONFIG_$key=${config_flags[$key]}" >> $config_file
          done
          sed -i '/check_defconfig/d' common/build.config.gki

      - name: Build Kernel
        run: |
          cd ${{ env.WORKSPACE }}
          ./kernel_platform/build_with_bazel.py \
            -t ${{ github.event.inputs.CPUD }} gki \
            -j$(($(nproc) + 1)) \
            --verbose_failures

      - name: Package Artifacts
        run: |
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/Woiui/AnyKernel3
          find ${{ env.WORKSPACE }} -name Image -exec cp -v {} AnyKernel3/ \;
          curl -fL -o AnyKernel3/zram.zip \
            https://github.com/Woiui/kernel_manifest/releases/latest/download/zram.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_${{ env.KSU_VER }}_${{ github.event.inputs.FEIL }}
          path: |
            ${{ github.workspace }}/AnyKernel3/*
            ${{ env.WORKSPACE }}/kernel_platform/out/**/Image
          retention-days: 3

      - name: Post Cleanup
        if: ${{ always() }}
        run: |
          rm -rf ${{ env.WORKSPACE }} || true
