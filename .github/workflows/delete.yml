name: Build OnePlus SukiSU Ultra (LZ4KD) - Optimized

on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "CPU Platform"
        required: true
        type: choice
        options: ['sm8650']
        default: 'sm8650'
      FEIL:
        description: "Device Model"
        required: true
        type: choice
        options: ['gt5pro']
        default: 'gt5pro'
      CPUD:
        description: "SoC Codename"
        required: true
        type: choice
        options: ['pineapple']
        default: 'pineapple'
      ANDROID_VERSION:
        description: "Android Version"
        required: true
        type: choice
        options: ['android14']
        default: 'android14'
      KERNEL_VERSION:
        description: "Kernel Version"
        required: true
        type: choice
        options: ['6.1']
        default: '6.1'

jobs:
  build:
    name: Build ${{ github.event.inputs.FEIL }}
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      KERNEL_DIR: ${{ github.workspace }}/kernel_workspace/kernel_platform
      ANY_KERNEL_DIR: ${{ github.workspace }}/AnyKernel3

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 12288
          temp-reserve-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Setup Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Essential Packages
        run: |
          sudo apt update && sudo apt full-upgrade -y
          sudo apt install -y \
            python3 python3-pip git curl \
            build-essential flex bison libssl-dev \
            rsync unzip bc libelf-dev

      - name: Install Repo Tool
        run: |
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: Initialize Kernel Source
        working-directory: ${{ env.WORKSPACE }}
        run: |
          repo init -u https://github.com/ferstar/kernel_manifest.git \
            -b realme/${{ github.event.inputs.CPU }} \
            -m ${{ github.event.inputs.FEIL }}.xml \
            --depth=1 --repo-url=https://gerrit.googlesource.com/git-repo
          repo sync -j$(nproc) --force-sync --no-clone-bundle

      - name: Clean Build Artifacts
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          find . -name BUILD.bazel -exec sed -i '/protected_exports_list/d' {} +
          find . -name abi_gki_protected_exports_* -delete 2>/dev/null || true

      - name: Patch Kernel Version
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          for scm_file in $(find . -name setlocalversion); do
            sed -i -e 's/-dirty//g' -e '/scm_version/d' $scm_file
            echo 'res="${res/-dirty/}"' >> $scm_file
          done
          git add . && git commit -m "[CI] Remove dirty suffix" || true

      - name: Setup KernelSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          bash <(curl -sL https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh) susfs-dev
          KSU_VER=$(( $(git rev-list --count HEAD) + 10600 ))
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=.*/DKSU_VERSION=$KSU_VER/" kernel/Makefile

      - name: Apply Kernel Patches
        working-directory: ${{ env.WORKSPACE }}
        run: |
          git clone --filter=blob:none --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          
          rsync -av susfs4ksu/kernel_patches/ ${{ env.KERNEL_DIR }}/common/
          cp -rf SukiSU_patch/other/zram/lz4k/* ${{ env.KERNEL_DIR }}/common/

          cd ${{ env.KERNEL_DIR }}/common
          for patch_file in *.patch; do
            patch -p1 --ignore-whitespace < $patch_file || echo "Patch $patch_file skipped"
          done

      - name: Configure Kernel Flags
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          config_file="common/arch/arm64/configs/gki_defconfig"
          declare -A config_flags=(
            ["KSU"]="y"
            ["KPM"]="y"
            ["KSU_SUSFS"]="y"
            ["CRYPTO_LZ4HC"]="y"
            ["CRYPTO_LZ4KD"]="y"
          )
          for key in "${!config_flags[@]}"; do
            echo "CONFIG_$key=${config_flags[$key]}" >> $config_file
          done
          sed -i '/check_defconfig/d' common/build.config.gki

      - name: Build Kernel Image
        working-directory: ${{ env.WORKSPACE }}
        run: |
          ./kernel_platform/build_with_bazel.py \
            -t ${{ github.event.inputs.CPUD }} gki \
            -j$(($(nproc) + 1)) \
            --verbose_failures

      - name: Prepare AnyKernel3
        working-directory: ${{ env.WORKSPACE }}
        run: |
          git clone --depth=1 https://github.com/Woiui/AnyKernel3
          find ./kernel_platform/out -name Image -exec cp -v {} AnyKernel3/ \;
          curl -fL -o AnyKernel3/zram.zip \
            https://github.com/Woiui/kernel_manifest/releases/latest/download/zram.zip

      - name: Post-process Kernel Image
        working-directory: ${{ env.WORKSPACE }}/kernel_platform/out
        run: |
          latest_image=$(find . -name Image -printf '%T@ %p\n' | sort -n | tail -1 | cut -f2- -d" ")
          [ -n "$latest_image" ] && {
            curl -sL https://github.com/ShirkNeko/SukiSU_KernelPatch_patch/releases/download/0.11-beta/patch_linux \
              | sudo dd of=./patch_linux
            chmod +x ./patch_linux
            ./patch_linux "$latest_image"
            mv oImage "$latest_image"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_${{ env.KSU_VER }}_${{ github.event.inputs.FEIL }}
          path: |
            ${{ env.WORKSPACE }}/AnyKernel3/*
            ${{ env.WORKSPACE }}/kernel_platform/out/**/Image
          retention-days: 7

      - name: Cleanup Workspace
        if: ${{ always() }}
        run: |
          rm -rf ${{ env.WORKSPACE }} || true
